<html>
    <head>
        <link rel="icon" href="data:," />
        <style>
            body {
                padding: 0;
                margin: 0;
            }

            /* Rotated by CSS, not by Motion */
            #container {
                position: absolute;
                left: 200px;
                top: 150px;
                width: 400px;
                height: 300px;
                transform: rotate(30deg);
                background: #eee;
            }

            .box {
                position: absolute;
                left: 0;
                top: 50px;
                width: 100px;
                height: 80px;
                background-color: #00cc88;
            }

            .box.moved {
                left: 250px;
                top: 150px;
            }

            .ghost {
                visibility: hidden;
            }

            [data-layout-correct="false"] {
                background: #dd1144 !important;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div class="box ghost" id="start"></div>
            <div
                class="box ghost"
                id="mid"
                style="left: 125px; top: 100px"
            ></div>
            <div class="box ghost moved" id="end"></div>
            <div class="box" id="box" data-layout></div>
        </div>

        <script type="module" src="/src/imports/animate-layout.js"></script>
        <script type="module" src="/src/imports/script-quad.js"></script>
        <script type="module">
            const { animateLayout } = window.AnimateLayout
            const { corners, matchCorners, nextFrame, done, fail } = window.Quad

            /**
             * A box moving within a rotated container should slide along
             * the container's axes, staying the same shape.
             */
            async function runTest() {
                const box = document.getElementById("box")
                const start = corners(document.getElementById("start"))
                const mid = corners(document.getElementById("mid"))
                const end = corners(document.getElementById("end"))

                matchCorners(box, start, "before")

                const controls = await animateLayout(
                    () => box.classList.add("moved"),
                    { duration: 10, ease: "linear" }
                )

                controls.pause()
                controls.time = 0
                await nextFrame()
                matchCorners(box, start, "0%")

                controls.time = 5
                await nextFrame()
                matchCorners(box, mid, "50%")

                controls.time = 10
                await nextFrame()
                matchCorners(box, end, "100%")

                done()
            }

            runTest().catch(fail)
        </script>
    </body>
</html>
