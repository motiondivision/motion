<html>
    <head>
        <link rel="icon" href="data:," />
        <style>
            body {
                padding: 0;
                margin: 0;
            }

            #container {
                position: absolute;
                left: 100px;
                top: 100px;
                width: 400px;
                height: 300px;
                transform: translateX(20px);
            }

            .box {
                position: absolute;
                left: 0;
                top: 0;
                width: 100px;
                height: 80px;
                background-color: #00cc88;
            }

            .box.moved {
                left: 200px;
                top: 100px;
            }

            [data-layout-correct="false"] {
                background: #dd1144 !important;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div class="box" id="box" data-layout></div>
        </div>

        <script type="module" src="/src/imports/animate-layout.js"></script>
        <script type="module" src="/src/imports/script-quad.js"></script>
        <script type="module">
            const { animateLayout } = window.AnimateLayout
            const { report, seek, done, fail } = window.Quad

            /**
             * Without layers that turn, scale or tilt anything, layout
             * animations keep rendering translate and scale, from the box
             * engine.
             */
            async function runTest() {
                const box = document.getElementById("box")
                const controls = await animateLayout(
                    () => box.classList.add("moved"),
                    { duration: 10, ease: "linear" }
                )
                controls.pause()
                await seek(controls, 5)

                const { transform } = box.style
                if (
                    !transform.startsWith("translate3d(") ||
                    transform.includes("matrix")
                ) {
                    report(box, `Expected a box transform, got ${transform}`)
                }

                done()
            }

            runTest().catch(fail)
        </script>
    </body>
</html>
