<html>
    <head>
        <link rel="icon" href="data:," />
        <style>
            body {
                padding: 0;
                margin: 0;
            }

            /* Rotated by CSS, not by Motion */
            #card {
                position: absolute;
                left: 80px;
                top: 120px;
                width: 300px;
                height: 220px;
                transform: rotate(-20deg);
                background: #eee;
            }

            #modal {
                position: absolute;
                left: 450px;
                top: 250px;
                width: 400px;
                height: 300px;
                background: #ddd;
            }

            .small {
                position: absolute;
                left: 30px;
                top: 40px;
                width: 120px;
                height: 80px;
                background-color: #00cc88;
            }

            .large {
                position: absolute;
                left: 60px;
                top: 50px;
                width: 240px;
                height: 160px;
                background-color: #00cc88;
            }

            .ghost {
                visibility: hidden;
            }

            [data-layout-correct="false"] {
                background: #dd1144 !important;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div id="card">
            <div class="small" id="a" data-layout-id="hero"></div>
        </div>
        <div id="modal"></div>

        <script type="module" src="/src/imports/animate-layout.js"></script>
        <script type="module" src="/src/imports/script-quad.js"></script>
        <script type="module">
            const { animateLayout, animate } = window.AnimateLayout
            const { corners, describe, check, nextFrame, seek, done, fail } =
                window.Quad

            const mix = (a, b, p) => a + (b - a) * p

            /**
             * The radius each corner is drawn with, in visible pixels: CSS
             * resolves a percentage radius against the element's own box,
             * which its transform then scales.
             */
            function visibleRadius(element) {
                const { width, height } = describe(corners(element))
                const [x, y = x] =
                    getComputedStyle(element).borderTopLeftRadius.split(" ")
                const toPixels = (value, size) =>
                    value.endsWith("%")
                        ? (parseFloat(value) / 100) * size
                        : parseFloat(value)
                return [toPixels(x, width), toPixels(y, height)]
            }

            /**
             * A shared element moves out of a rotated card into a flat
             * modal, as in shared-rotated-to-flat. Its border radius,
             * set with Motion, mixes from the old element's to the new
             * one's, and stays round as the projection scales it.
             */
            async function runTest() {
                const a = document.getElementById("a")
                animate(a, { borderRadius: 10 }, { duration: 0 })
                await nextFrame()

                const controls = await animateLayout(
                    () => {
                        a.remove()
                        const b = document.createElement("div")
                        b.id = "b"
                        b.className = "large"
                        b.dataset.layoutId = "hero"
                        document.getElementById("modal").appendChild(b)
                        animate(b, { borderRadius: 40 }, { duration: 0 })
                    },
                    { duration: 10, ease: "linear" }
                )
                controls.pause()

                const b = document.getElementById("b")
                for (const progress of [0, 0.25, 0.5, 1]) {
                    await seek(controls, progress * 10)
                    const expected = mix(10, 40, progress)
                    const [x, y] = visibleRadius(b)
                    check(
                        Math.abs(x - expected) < 0.5 &&
                            Math.abs(y - expected) < 0.5,
                        `${progress * 100}% radius [${x.toFixed(
                            2
                        )}, ${y.toFixed(2)}] isn't ${expected}px`
                    )
                }

                done()
            }

            runTest().catch(fail)
        </script>
    </body>
</html>
