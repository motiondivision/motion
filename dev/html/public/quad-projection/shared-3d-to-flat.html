<html>
    <head>
        <link rel="icon" href="data:," />
        <style>
            body {
                padding: 0;
                margin: 0;
            }

            #stage {
                position: absolute;
                left: 40px;
                top: 60px;
                width: 400px;
                height: 400px;
                perspective: 600px;
            }

            /* Tilted in 3D by CSS, not by Motion */
            #card {
                position: absolute;
                left: 40px;
                top: 60px;
                width: 300px;
                height: 260px;
                transform: rotateY(50deg);
                background: #eee;
            }

            #modal {
                position: absolute;
                left: 500px;
                top: 200px;
                width: 400px;
                height: 300px;
                background: #ddd;
            }

            .small {
                position: absolute;
                left: 40px;
                top: 50px;
                width: 160px;
                height: 120px;
                background-color: #00cc88;
            }

            .large {
                position: absolute;
                left: 40px;
                top: 40px;
                width: 300px;
                height: 200px;
                background-color: #00cc88;
            }

            .ghost {
                visibility: hidden;
            }

            [data-layout-correct="false"] {
                background: #dd1144 !important;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div id="stage">
            <div id="card">
                <div class="small" id="a" data-layout-id="hero"></div>
            </div>
        </div>
        <div id="modal">
            <div class="large ghost" id="end"></div>
        </div>

        <script type="module" src="/src/imports/animate-layout.js"></script>
        <script type="module" src="/src/imports/script-quad.js"></script>
        <script type="module">
            const { animateLayout } = window.AnimateLayout
            const {
                centre,
                corners,
                matchCorners,
                matchPoint,
                mix,
                seek,
                done,
                fail,
            } = window.Quad

            /**
             * A shared element moves out of a card tilted away in
             * perspective into a flat modal. It starts on the card's
             * foreshortened corners, untilts as it moves, and its centre
             * travels in a straight line.
             */
            async function runTest() {
                const start = corners(document.getElementById("a"))
                const end = corners(document.getElementById("end"))

                const controls = await animateLayout(
                    () => {
                        document.getElementById("a").remove()
                        const b = document.createElement("div")
                        b.id = "b"
                        b.className = "large"
                        b.dataset.layoutId = "hero"
                        document.getElementById("modal").appendChild(b)
                    },
                    { duration: 10, ease: "linear" }
                )
                controls.pause()

                const b = document.getElementById("b")

                await seek(controls, 0)
                matchCorners(b, start, "0%")

                for (const progress of [0.25, 0.5, 0.75]) {
                    await seek(controls, progress * 10)
                    matchPoint(
                        b,
                        centre(corners(b)),
                        mix(centre(start), centre(end), progress),
                        `${progress * 100}% centre`
                    )
                }

                await seek(controls, 10)
                matchCorners(b, end, "100%")

                done()
            }

            runTest().catch(fail)
        </script>
    </body>
</html>
