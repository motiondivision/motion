<html>
    <head>
        <link rel="icon" href="data:," />
        <style>
            body {
                padding: 0;
                margin: 0;
            }

            /* Rotated by CSS, not by Motion */
            .container {
                position: absolute;
                left: 250px;
                top: 150px;
                width: 400px;
                height: 300px;
                background: #eee;
            }

            .container.turned {
                transform: rotate(40deg);
            }

            .box {
                position: absolute;
                left: 20px;
                top: 20px;
                width: 100px;
                height: 80px;
                background-color: #00cc88;
            }

            .box.moved {
                left: 240px;
                top: 180px;
            }

            /* Each one nested in the last */
            .nested {
                position: absolute;
                left: 2px;
                top: 2px;
                width: 20px;
                height: 16px;
                background-color: #0077ff;
            }

            #other {
                position: absolute;
                left: 700px;
                top: 80px;
                width: 60px;
                height: 40px;
                background-color: #ffaa00;
            }

            .ghost {
                visibility: hidden;
            }

            [data-layout-correct="false"] {
                background: #dd1144 !important;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div class="container turned ghost">
            <div class="box moved ghost" id="end"></div>
        </div>
        <div class="container" id="container">
            <div class="box" id="box" data-layout></div>
        </div>
        <div id="other" data-layout-id="hero"></div>

        <script type="module" src="/src/imports/animate-layout.js"></script>
        <script type="module" src="/src/imports/script-quad.js"></script>
        <script type="module">
            const { animateLayout } = window.AnimateLayout
            const { corners, matchCorners, seek, done, fail } = window.Quad

            const depth = 40

            const box = document.getElementById("box")
            let parent = box
            for (let i = 0; i < depth; i++) {
                const nested = document.createElement("div")
                nested.className = "nested"
                nested.dataset.layout = ""
                parent.appendChild(nested)
                parent = nested
            }

            /**
             * As container-turns, with a chain of nested elements inside
             * the box. A new element at the end of the chain takes over
             * from one outside it, which stays mounted and follows it.
             * The follower is drawn where every level above the lead
             * puts it.
             */
            async function runTest() {
                const container = document.getElementById("container")
                const other = document.getElementById("other")
                const start = corners(other)
                const lead = document.createElement("div")

                const controls = await animateLayout(
                    () => {
                        container.classList.add("turned")
                        box.classList.add("moved")
                        lead.className = "nested"
                        lead.dataset.layoutId = "hero"
                        parent.appendChild(lead)
                    },
                    { duration: 10, ease: "linear" }
                )
                controls.pause()

                await seek(controls, 0)
                matchCorners(lead, start, "lead 0%")

                for (const time of [0, 3, 5, 8]) {
                    await seek(controls, time)
                    matchCorners(other, corners(lead), `follower ${time * 10}%`)
                }

                done()
            }

            runTest().catch(fail)
        </script>
    </body>
</html>
