<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture Arena Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
    /* Layout: a stage on the left where gestures happen, a live arena readout on the right; stacks on phones. */
    :root {
        --bg: #f3f4f7;
        --panel: #ffffff;
        --ink: #14161c;
        --muted: #646b7a;
        --line: #dfe2ea;
        --accent: #ff1f5a;
        --accent-soft: #ffe1ea;
        --possible: #c98a00;
        --possible-soft: #fff1cc;
        --active: #0f9b5a;
        --active-soft: #d7f5e6;
        --ended: #8a90a0;
        --surface: #e8eaf0;
        --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #0f1116; --panel: #171a21; --ink: #eef0f5; --muted: #9aa1b2;
            --line: #2a2f3a; --accent: #ff4b7c; --accent-soft: #3a1622;
            --possible: #f2b632; --possible-soft: #3a2e10; --active: #38d38a;
            --active-soft: #10321f; --ended: #6c7282; --surface: #1f232c;
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #0f1116; --panel: #171a21; --ink: #eef0f5; --muted: #9aa1b2;
        --line: #2a2f3a; --accent: #ff4b7c; --accent-soft: #3a1622;
        --possible: #f2b632; --possible-soft: #3a2e10; --active: #38d38a;
        --active-soft: #10321f; --ended: #6c7282; --surface: #1f232c;
        color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 15px;
        line-height: 1.45;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 20px 32px;
    }
    header { max-width: 1180px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
    h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
    header p { margin: 0; color: var(--muted); max-width: 62ch; }
    main {
        max-width: 1180px; margin: 0 auto;
        display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px;
    }
    @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

    /* Scenario tabs */
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
    .tabs button {
        font: 500 14px var(--font-display); color: var(--muted);
        background: transparent; border: 1px solid transparent; border-radius: 8px;
        padding: 6px 10px; cursor: pointer;
    }
    .tabs button[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--line); }
    .tabs button:focus-visible, .opt input:focus-visible, .opt select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .brief { padding: 12px 16px 0; color: var(--muted); max-width: 70ch; }
    .brief strong { color: var(--ink); font-weight: 500; }

    /* Options row */
    .opts { display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 12px 16px; }
    .opt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .opt input[type="range"] { width: 110px; accent-color: var(--accent); }
    .opt input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
    .opt output { font: 600 12px var(--font-mono); color: var(--ink); min-width: 3.6em; font-variant-numeric: tabular-nums; }
    .opt select { font: 13px var(--font-display); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }

    /* Stage */
    .stage {
        position: relative; height: 460px; margin: 0 16px 16px; border-radius: 10px;
        background:
            radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0 / 22px 22px,
            var(--surface);
        overflow: hidden; touch-action: pan-y;
    }
    .label {
        position: absolute; top: 8px; left: 10px;
        font: 600 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
        pointer-events: none;
    }
    .thing {
        position: absolute; border-radius: 14px; user-select: none; -webkit-user-select: none;
        display: grid; place-items: center; text-align: center;
        font: 600 13px var(--font-display); color: #fff;
        box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 6px 18px -8px rgba(0,0,0,.35);
    }
    .thing small { display: block; font: 400 11px var(--font-mono); opacity: .85; }
    .card-a { background: #3b4bdb; }
    .btn-a { background: var(--accent); border: 0; border-radius: 999px; padding: 0 18px; height: 44px; cursor: pointer; font: 600 14px var(--font-display); color: #fff; }
    .ring { width: 150px; height: 150px; border-radius: 50%; background: #3b4bdb; cursor: pointer; }
    .ring svg { position: absolute; inset: -10px; width: 170px; height: 170px; pointer-events: none; }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .track { stroke: var(--line); }
    .ring .prog { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
    .count { font: 600 28px var(--font-mono); }
    .list { position: absolute; inset: 40px 16px 16px; overflow-y: auto; border-radius: 10px; touch-action: pan-y; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: color-mix(in srgb, var(--panel) 70%, transparent); }
    .row { position: relative; flex: none; height: 52px; border-radius: 10px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 500 14px var(--font-display); user-select: none; -webkit-user-select: none; box-shadow: none; }
    .row .grip { width: 6px; height: 22px; border-radius: 3px; background: repeating-linear-gradient(to bottom, var(--muted) 0 2px, transparent 2px 5px); opacity: .6; }
    .row.lifted { border-color: var(--accent); box-shadow: 0 10px 24px -10px rgba(0,0,0,.45); z-index: 2; }
    .sheet { position: absolute; left: 50%; top: 70px; width: min(520px, calc(100% - 32px)); height: 330px; margin-left: calc(min(520px, calc(100% - 32px)) / -2); border-radius: 18px; background: #23262f; padding: 40px 0 0; overflow: hidden; }
    .sheet .label { color: #b9bfcc; }
    .track-x { display: flex; gap: 12px; padding: 0 16px; width: max-content; }
    .slide { width: 180px; height: 220px; flex: none; border-radius: 14px; display: grid; place-items: center; font: 600 15px var(--font-display); color: #fff; user-select: none; -webkit-user-select: none; }
    .photo { width: 240px; height: 170px; background: linear-gradient(135deg, #ff1f5a, #ff9b3d 45%, #ffd23f 70%, #3bd7a0); border-radius: 12px; }
    .hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; padding: 0 12px; }

    /* Readout */
    aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    aside h2 { font: 600 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 12px 14px 8px; display: flex; justify-content: space-between; }
    .live { list-style: none; margin: 0; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 118px; }
    .live li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; background: var(--surface); font: 12px var(--font-mono); }
    .live li .kind { font-weight: 600; }
    .live li .el { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip { font: 600 10px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: 3px 7px; border-radius: 999px; }
    .chip.possible { color: var(--possible); background: var(--possible-soft); }
    .chip.active { color: var(--active); background: var(--active-soft); }
    .chip.ended { color: var(--ended); background: var(--surface); }
    .empty { color: var(--muted); font-size: 13px; padding: 10px 6px; }
    .log { list-style: none; margin: 0; padding: 0 14px 12px; height: 300px; overflow-y: auto; font: 12px/1.6 var(--font-mono); font-variant-numeric: tabular-nums; }
    .log li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; border-bottom: 1px dashed var(--line); padding: 2px 0; }
    .log .t { color: var(--muted); }
    .log .cb { color: var(--accent); }
    .clear { font: 600 10px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 14px 12px; font-size: 12px; color: var(--muted); align-items: center; }
    /* On phones the stage and readout can't both fit, so the live list floats at the bottom */
    @media (max-width: 860px) {
        body { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
        .live-card {
            position: fixed; z-index: 5;
            left: max(16px, env(safe-area-inset-left, 0px));
            right: max(16px, env(safe-area-inset-right, 0px));
            bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            max-height: 170px; overflow-y: auto;
            box-shadow: 0 12px 32px -12px rgba(0,0,0,.45);
        }
        .live { min-height: 0; }
        .legend { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<header>
    <h1>Gesture arena playground</h1>
    <p>Every press, hover, drag and pinch reports to one state machine. Try a scenario on the left and watch each gesture go possible, active, then ended on the right.</p>
</header>

<main>
    <section class="card" aria-label="Scenarios">
        <div class="tabs" role="tablist" id="tabs"></div>
        <p class="brief" id="brief"></p>
        <div class="opts" id="opts"></div>
        <div class="stage" id="stage"></div>
    </section>

    <aside>
        <div class="card live-card">
            <h2><span>In the arena now</span><span id="count">0</span></h2>
            <ul class="live" id="live"></ul>
            <div class="legend">
                <span class="chip possible">possible</span> waiting to win the pointer
                <span class="chip active">active</span> owns it
            </div>
        </div>
        <div class="card">
            <h2><span>Phase log</span><button class="clear" id="clear" type="button">Clear</button></h2>
            <ul class="log" id="log"></ul>
        </div>
    </aside>
</main>

<script type="module" src="/src/inc.js"></script>
<script type="module">
(function () {
    const M = window.Motion
    const { drag, press, hover, pinch, animate, onGestureChange, getGestures } = M

    const $ = (id) => document.getElementById(id)
    const stage = $("stage")
    const t0 = performance.now()
    const nameOf = (el) => (el && el.dataset && el.dataset.name) || (el && el.tagName ? el.tagName.toLowerCase() : "window")

    // Readout
    const log = (text, kind) => {
        const li = document.createElement("li")
        const s = ((performance.now() - t0) / 1000).toFixed(2)
        li.innerHTML = `<span class="t">${s}s</span><span class="${kind || ""}"></span>`
        li.lastChild.textContent = text
        const list = $("log")
        list.appendChild(li)
        while (list.children.length > 200) list.firstChild.remove()
        list.scrollTop = list.scrollHeight
    }
    const renderLive = () => {
        const live = $("live")
        const gestures = getGestures()
        $("count").textContent = gestures.length
        live.innerHTML = ""
        if (!gestures.length) {
            live.innerHTML = '<li class="empty" style="display:block;background:none">Nothing yet. Touch, hover or drag something.</li>'
            return
        }
        gestures.forEach((g) => {
            const li = document.createElement("li")
            const pointer = g.pointerId === undefined ? "" : " · pointer " + g.pointerId
            li.innerHTML = `<span class="kind"></span><span class="el"></span><span class="chip ${g.phase}">${g.phase}</span>`
            li.children[0].textContent = g.kind
            li.children[1].textContent = nameOf(g.element) + pointer
            live.appendChild(li)
        })
    }
    let raf = 0
    onGestureChange((g) => {
        log(`${g.kind} ${nameOf(g.element)} → ${g.phase}`)
        if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderLive() })
    })
    $("clear").onclick = () => { $("log").innerHTML = "" }
    renderLive()

    // Helpers
    const el = (html) => {
        const t = document.createElement("template")
        t.innerHTML = html.trim()
        return t.content.firstElementChild
    }
    const opt = {}
    const control = (o) => {
        const id = "opt-" + o.key
        const wrap = el(`<label class="opt" for="${id}"></label>`)
        wrap.append(o.label)
        let input
        if (o.type === "range") {
            input = el(`<input id="${id}" type="range" min="${o.min}" max="${o.max}" step="${o.step}" value="${o.value}">`)
            const out = el(`<output for="${id}"></output>`)
            const show = () => { out.textContent = o.format(+input.value) }
            input.addEventListener("input", () => { opt[o.key] = +input.value; show(); o.live || rebuild() })
            opt[o.key] = o.value
            show()
            wrap.append(input, out)
        } else if (o.type === "check") {
            input = el(`<input id="${id}" type="checkbox"${o.value ? " checked" : ""}>`)
            input.addEventListener("change", () => { opt[o.key] = input.checked; rebuild() })
            opt[o.key] = o.value
            wrap.prepend(input)
        } else {
            input = el(`<select id="${id}">${o.options.map((v) => `<option${v === o.value ? " selected" : ""}>${v}</option>`).join("")}</select>`)
            input.addEventListener("change", () => { opt[o.key] = input.value; rebuild() })
            opt[o.key] = o.value
            wrap.append(input)
        }
        return wrap
    }
    const sec = (v) => (v ? v.toFixed(2) + "s" : "off")
    const tapLogger = (label) => () => {
        log(`${label}: press start`, "cb")
        return (_e, { success }) => log(`${label}: ${success ? "tap" : "tap cancelled"}`, "cb")
    }
    const squash = (target) => () => {
        animate(target, { scale: 0.94 }, { type: "spring", visualDuration: 0.15, bounce: 0 })
        return () => animate(target, { scale: 1 }, { type: "spring", visualDuration: 0.3, bounce: 0.4 })
    }

    // Scenarios
    const scenarios = [
        {
            id: "card",
            name: "Card with a button",
            brief: "<strong>The draggable card owns the pointer once it moves.</strong> Press the button and drag: its press is cancelled the moment the card starts dragging, so it can't stay squashed or fire a tap. A still click still taps.",
            controls: [
                { key: "dragAfter", type: "range", label: "Card drags after", min: 0, max: 1, step: 0.05, value: 0, format: sec },
                { key: "samePress", type: "check", label: "Press the card itself too", value: false },
            ],
            mount(stops) {
                const card = el(`<div class="thing card-a" data-name="card" style="left:calc(50% - 130px);top:110px;width:260px;height:200px;align-content:start;padding-top:26px">Draggable card<small>drag me anywhere</small></div>`)
                const button = el(`<button class="btn-a" data-name="button" style="position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:28px">Buy now</button>`)
                card.append(button)
                stage.append(card, el(`<span class="hint">Mouse, touch or pen. Watch the button's press end as soon as the card moves.</span>`))
                stops.push(drag(card, { after: opt.dragAfter || undefined, constraints: stage, elastic: 0.2 }))
                stops.push(press(button, () => {
                    log("button: press start", "cb")
                    animate(button, { scale: 0.92 }, { duration: 0.12 })
                    return (_e, { success }) => {
                        animate(button, { scale: 1 }, { type: "spring", bounce: 0.5, visualDuration: 0.3 })
                        log(`button: ${success ? "tap" : "tap cancelled"}`, "cb")
                    }
                }))
                if (opt.samePress) stops.push(press(card, tapLogger("card")))
                stops.push(hover(card, () => { log("card: hover start", "cb"); return () => log("card: hover end", "cb") }))
                stops.push(hover(button, () => { log("button: hover start", "cb"); return () => log("button: hover end", "cb") }))
            },
        },
        {
            id: "long-press",
            name: "Long press",
            brief: "<strong>Press options from the press PR.</strong> Hold for <code>after</code> seconds to start the press (the ring fills), set <code>times</code> for a double or triple press, and <code>repeat</code> to step a counter while held. Moving more than 8px cancels a pending hold.",
            controls: [
                { key: "after", type: "range", label: "after", min: 0, max: 1.5, step: 0.05, value: 0.5, format: sec },
                { key: "repeat", type: "range", label: "repeat", min: 0, max: 0.5, step: 0.05, value: 0, format: sec },
                { key: "times", type: "select", label: "times", options: ["1", "2", "3"], value: "1" },
                { key: "parentDrag", type: "check", label: "Inside a draggable panel", value: true },
            ],
            mount(stops) {
                const panel = el(`<div class="thing" data-name="panel" style="left:calc(50% - 160px);top:60px;width:320px;height:320px;background:#23262f;border-radius:20px;align-content:start;padding-top:14px;color:#b9bfcc">Panel<small>${opt.parentDrag ? "draggable" : "fixed"}</small></div>`)
                const ring = el(`<div class="thing ring" data-name="ring" style="left:85px;top:95px"><svg viewBox="0 0 170 170" aria-hidden="true"><circle class="track" cx="85" cy="85" r="80"></circle><circle class="prog" cx="85" cy="85" r="80" stroke-dasharray="502.65" stroke-dashoffset="502.65"></circle></svg><span class="count">0</span></div>`)
                panel.append(ring)
                stage.append(panel, el(`<span class="hint">Hold the circle. Once its hold passes it owns the pointer, so the panel can't be dragged by that touch.</span>`))
                const prog = ring.querySelector(".prog")
                const count = ring.querySelector(".count")
                let n = 0
                const setProgress = (p) => prog.setAttribute("stroke-dashoffset", 502.65 * (1 - p))
                const times = +opt.times
                stops.push(press(ring, () => {
                    log("ring: press start", "cb")
                    animate(ring, { scale: 0.95 }, { duration: 0.15 })
                    return {
                        onHold: (p) => setProgress(p),
                        onRepeat: (c) => { count.textContent = ++n; log(`ring: repeat ${c}`, "cb") },
                        onComplete: (_e, { success }) => {
                            setProgress(0)
                            animate(ring, { scale: 1 }, { type: "spring", bounce: 0.5, visualDuration: 0.3 })
                            if (success) count.textContent = ++n
                            log(`ring: ${success ? "pressed" : "cancelled"}`, "cb")
                        },
                    }
                }, { after: opt.after || undefined, repeat: opt.repeat || undefined, times }))
                if (opt.parentDrag) stops.push(drag(panel, { constraints: stage, elastic: 0.2 }))
            },
        },
        {
            id: "hold-to-drag",
            name: "Hold to drag a list",
            brief: "<strong>New <code>dragAfter</code>.</strong> On touch, swipe the list to scroll it. Hold a row still for the delay, then move to drag it. Rows also have a press, which the hold cancels.",
            controls: [
                { key: "rowAfter", type: "range", label: "dragAfter", min: 0, max: 1, step: 0.05, value: 0.3, format: sec },
            ],
            mount(stops) {
                const list = el(`<div class="list" data-name="list"></div>`)
                stage.append(el(`<span class="label">Scrollable list</span>`), list)
                const fruit = ["Apricot", "Blackberry", "Cherry", "Damson", "Elderberry", "Fig", "Greengage", "Huckleberry", "Jujube", "Kumquat", "Lime", "Medlar"]
                fruit.forEach((f, i) => {
                    const row = el(`<div class="row" data-name="row ${f.toLowerCase()}"><span class="grip"></span>${f}</div>`)
                    list.append(row)
                    stops.push(drag(row, {
                        axis: "y",
                        after: opt.rowAfter || undefined,
                        snapToOrigin: true,
                        onStart: () => row.classList.add("lifted"),
                        onEnd: () => row.classList.remove("lifted"),
                    }))
                    stops.push(press(row, tapLogger(f.toLowerCase())))
                })
            },
        },
        {
            id: "nested",
            name: "Nested drags",
            brief: "<strong>Drags on different axes run together.</strong> The sheet drags on y and the carousel inside it on x, so a diagonal drag moves both. Switch the carousel to both axes and the inner drag wins the pointer alone.",
            controls: [
                { key: "innerAxis", type: "select", label: "Carousel axis", options: ["x", "both"], value: "x" },
                { key: "propagation", type: "check", label: "propagation", value: false },
            ],
            mount(stops) {
                const sheet = el(`<div class="sheet" data-name="sheet"><span class="label">Sheet · drag y</span></div>`)
                const track = el(`<div class="track-x" data-name="carousel"></div>`)
                ;["#3b4bdb", "#ff1f5a", "#0f9b5a", "#c98a00", "#7a3bdb"].forEach((c, i) => track.append(el(`<div class="slide" style="background:${c}">Slide ${i + 1}</div>`)))
                sheet.append(track)
                stage.append(sheet)
                stops.push(drag(sheet, { axis: "y", constraints: { top: -40, bottom: 80 }, elastic: 0.3 }))
                stops.push(drag(track, {
                    axis: opt.innerAxis === "x" ? "x" : undefined,
                    constraints: opt.innerAxis === "x" ? { left: -620, right: 0 } : { left: -620, right: 0, top: -30, bottom: 30 },
                    propagation: opt.propagation,
                }))
            },
        },
        {
            id: "pinch",
            name: "Pinch and drag",
            brief: "<strong>Pinch from the pinch PR.</strong> Two fingers zoom and rotate the photo; a trackpad pinch works too. A pinch claims both touches and runs alongside the photo's own drag. The caption has a press, which a pinch cancels.",
            controls: [
                { key: "rotate", type: "check", label: "rotate", value: true },
                { key: "photoDrag", type: "check", label: "Photo is draggable", value: true },
                { key: "max", type: "range", label: "max scale", min: 1.5, max: 6, step: 0.5, value: 4, format: (v) => v + "×" },
            ],
            mount(stops) {
                const photo = el(`<div class="thing photo" data-name="photo" style="left:calc(50% - 120px);top:120px"><button class="btn-a" data-name="caption" style="position:absolute;bottom:10px;left:10px;height:32px;font-size:12px;padding:0 12px">Caption</button></div>`)
                stage.append(photo, el(`<span class="hint">On a phone, use two fingers. On a laptop, pinch the trackpad over the photo.</span>`))
                if (opt.photoDrag) stops.push(drag(photo, { elastic: 0.2 }))
                stops.push(pinch(photo, () => {
                    log("photo: pinch start", "cb")
                    return (_e, info) => {
                        log(`photo: pinch end, scale ${info.scale.toFixed(2)}, rotate ${Math.round(info.rotate)}°`, "cb")
                    }
                }, { rotate: opt.rotate, min: 0.5, max: opt.max }))
                stops.push(press(photo.querySelector("button"), tapLogger("caption")))
                const reset = el(`<button class="clear" type="button" style="position:absolute;top:10px;right:10px">Reset photo</button>`)
                reset.onclick = () => animate(photo, { scale: 1, rotate: 0, x: 0, y: 0 }, { type: "spring", bounce: 0.2 })
                stage.append(reset)
            },
        },
    ]

    // Tabs + lifecycle
    let current = scenarios[0]
    let stops = []
    const tabs = $("tabs")
    const select = (s) => {
        current = s
        ;[...tabs.children].forEach((b) => b.setAttribute("aria-selected", b.dataset.id === s.id))
        $("brief").innerHTML = s.brief
        const opts = $("opts")
        opts.innerHTML = ""
        s.controls.forEach((c) => opts.append(control(c)))
        try { localStorage.setItem("arena-tab", s.id) } catch (e) {}
        rebuild()
    }
    const rebuild = () => {
        stops.forEach((stop) => stop())
        stops = []
        stage.innerHTML = ""
        current.mount(stops)
        log(`— ${current.name} —`)
        renderLive()
    }
    scenarios.forEach((s) => {
        const b = el(`<button type="button" role="tab" data-id="${s.id}"></button>`)
        b.textContent = s.name
        b.onclick = () => select(s)
        tabs.append(b)
    })
    let saved
    try { saved = localStorage.getItem("arena-tab") } catch (e) {}
    select(scenarios.find((s) => s.id === saved) || scenarios[0])
})()
</script>

</body>
</html>
