<html>
    <head>
        <style>
            body {
                margin: 0;
            }

            canvas {
                display: block;
                width: 300px;
                height: 250px;
            }

            canvas > div {
                width: 200px;
                height: 100px;
                background: rgb(255, 0, 0);
            }
        </style>
    </head>
    <body>
        <canvas>
            <div id="panel"></div>
            <div id="second"></div>
        </canvas>
        <script type="module">
            import {
                animate,
                canvasLayer,
                frameData,
                motionValue,
                MotionGlobalConfig,
                processFrame,
            } from "/src/canvas-inc.js"
            import { nextRender } from "./pixels.js"

            /**
             * Left of `progress`, the element is drawn in `tint`. Above
             * `band.x`, it's white.
             */
            const wipe = `
                struct Uniforms { progress: f32, tint: vec4f, band: vec2f }
                fn effect(uv: vec2f) -> vec4f {
                    let color = element(uv);
                    if (uv.y < uniforms.band.x) { return vec4f(color.a); }
                    if (uv.x < uniforms.progress) { return uniforms.tint * color.a; }
                    return color;
                }
            `

            const canvas = document.querySelector("canvas")
            const layer = canvasLayer(canvas)
            const panel = document.getElementById("panel")
            const second = document.getElementById("second")
            const bandHeight = motionValue(0)
            const secondProgress = motionValue(0)

            layer.add(panel, {
                shader: wipe,
                uniforms: { progress: 0, tint: "#0000ff", band: [bandHeight, 0] },
            })
            // Same shader and program, its own values
            layer.add(second, {
                y: 120,
                shader: wipe,
                uniforms: { progress: secondProgress, tint: "#00ff00" },
            })

            /**
             * A shader that doesn't compile warns, and its element is
             * drawn without it.
             */
            const warnings = []
            const warn = console.warn
            console.warn = (...args) => {
                warnings.push(args.join(" "))
                warn(...args)
            }
            const broken = document.createElement("div")
            broken.style.cssText =
                "width:40px;height:40px;background:rgb(0,0,255)"
            layer.add(broken, {
                left: 240,
                top: 10,
                shader: "fn effect(uv: vec2f) -> vec4f { oops }",
            })

            Object.assign(window, {
                animate,
                bandHeight,
                frameData,
                layer,
                MotionGlobalConfig,
                panel,
                processFrame,
                second,
                secondProgress,
                warnings,
                nextRender: () => nextRender(layer),
            })

            nextRender(layer).then(() => (window.ready = true))
        </script>
    </body>
</html>
