<html>
    <head>
        <style>
            body {
                margin: 0;
            }

            motion-fx {
                width: 400px;
                height: 300px;
            }

            motion-fx > * {
                position: absolute;
                width: 100px;
                height: 60px;
                border: 0;
                padding: 0;
            }

            /* Centred, so perspective leaves its centre where it is */
            #card {
                left: 150px;
                top: 120px;
                background: rgb(255, 0, 0);
            }

            #behind {
                left: 150px;
                top: 20px;
                background: rgb(0, 255, 0);
            }

            /* No size: it's only a point for #moon to turn around */
            #pivot {
                left: 200px;
                top: 150px;
                width: 0;
                height: 0;
            }

            #moon {
                left: 260px;
                top: 130px;
                width: 40px;
                height: 40px;
                background: rgb(255, 255, 0);
            }

            /* Placed by its CSS transform: drawn from (30, 210) to (110, 290) */
            #css {
                left: 20px;
                top: 220px;
                width: 40px;
                height: 40px;
                background: rgb(0, 255, 255);
                transform: translate(30px, 10px) scale(2);
            }

            #front {
                left: 150px;
                top: 20px;
                background: rgb(0, 0, 255);
            }
        </style>
    </head>
    <body>
        <motion-fx perspective="400">
            <button id="card"></button>
            <div id="front"></div>
            <div id="behind"></div>
            <button id="css"></button>
            <div id="pivot"></div>
            <div id="moon" group="pivot"></div>
        </motion-fx>
        <script type="module">
            import {
                animate,
                canvasEffect,
                motionValue,
                defineFXShader,
                defineMotionFX,
                pinch,
            } from "/src/canvas-inc.js"
            import { nextRender } from "./pixels.js"

            const host = document.querySelector("motion-fx")

            let clicks = 0
            document
                .getElementById("card")
                .addEventListener("click", () => clicks++)

            const hits = []
            for (const id of ["front", "behind", "css"]) {
                document
                    .getElementById(id)
                    .addEventListener("click", () => hits.push(id))
            }

            /**
             * Draws a larger scene where it would be without a shader.
             */
            const flat = defineFXShader(
                `fn vertex(uv: vec2f) -> vec4f {
                    return project(vec3f(uv * layer.size - layer.origin, 0.0));
                }`,
                {},
                { extend: { top: 1, left: 0.5 } }
            )

            /**
             * Puts the scene 400px behind the canvas with project(), so
             * a perspective of 400 draws it at half size.
             */
            const far = defineFXShader(`
                fn vertex(uv: vec2f) -> vec4f {
                    return project(vec3f(uv * layer.size, -400.0));
                }`)

            defineMotionFX()

            Object.assign(window, {
                animate,
                canvasEffect,
                motionValue,
                host,
                far,
                flat,
                hits,
                nextRender: () => nextRender(host.layer),
            })
            Object.defineProperty(window, "clicks", { get: () => clicks })

            // Once the canvas draws #card, so pinch() finds its values there
            host.ready.then(() => pinch("#card"))

            host.ready.then((isReady) =>
                isReady
                    ? nextRender(host.layer).then(() => (window.ready = true))
                    : (window.ready = true)
            )
        </script>
    </body>
</html>
