<html>
    <head>
        <style>
            body {
                margin: 0;
            }

            motion-fx {
                position: absolute;
                left: 50px;
                top: 40px;
                width: 400px;
                height: 300px;
            }

            #card {
                width: 100px;
                height: 60px;
                background: rgb(255, 0, 0);
            }

            #button {
                width: 120px;
                height: 40px;
                border: 0;
                padding: 0;
                background: rgb(0, 0, 255);
                color: white;
            }

            #late {
                width: 50px;
                height: 50px;
                background: rgb(0, 255, 0);
            }
        </style>
    </head>
    <body>
        <motion-fx motion-blur="0.5" samples="12">
            <div id="card"></div>
            <button id="button" shader="invert">0</button>
        </motion-fx>
        <script type="module">
            import {
                animate,
                defineMotionFX,
                htmlInCanvas,
            } from "/src/canvas-inc.js"
            import { nextRender, readCanvas } from "./pixels.js"

            const host = document.querySelector("motion-fx")
            const card = document.getElementById("card")
            const button = document.getElementById("button")

            /**
             * Keep the GPU device, so a test can lose it.
             */
            if (self.GPUAdapter) {
                const request = GPUAdapter.prototype.requestDevice
                GPUAdapter.prototype.requestDevice = async function (...args) {
                    return (window.device = await request.apply(this, args))
                }
            }

            defineMotionFX({
                shaders: {
                    invert: `fn effect(uv: vec2f) -> vec4f {
                        let c = element(uv);
                        return vec4f(c.a - c.rgb, c.a);
                    }`,
                },
            })

            let clicks = 0
            button.addEventListener("click", () => clicks++)

            Object.assign(window, {
                animate,
                host,
                card,
                button,
                htmlInCanvas,
                nextRender: () => nextRender(host.layer),
            })
            Object.defineProperty(window, "clicks", { get: () => clicks })

            host.ready.then((isReady) =>
                isReady
                    ? nextRender(host.layer).then(() => (window.ready = true))
                    : (window.ready = true)
            )
        </script>
    </body>
</html>
