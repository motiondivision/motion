<html>
    <head>
        <style>
            body {
                margin: 0;
            }

            #box {
                position: absolute;
                left: 100px;
                top: 100px;
                width: 100px;
                height: 100px;
                background-color: red;
            }
        </style>
    </head>
    <body>
        <!--
            The 100x100 box starts at (100, 100). Params: rotate, pan=false,
            min, max, drag (also attach drag()).
        -->
        <div id="box"></div>
        <script type="module" src="/src/inc.js"></script>
        <script type="module">
            const { pinch, drag } = window.MotionDOM

            const params = new URLSearchParams(window.location.search)
            const num = (name) =>
                params.has(name) ? parseFloat(params.get(name)) : undefined

            const box = document.getElementById("box")

            window.events = []
            window.lastInfo = null

            if (params.has("drag")) drag(box, { momentum: false })

            window.stopPinch = pinch(box, {
                rotate: params.has("rotate"),
                pan: params.get("pan") !== "false",
                min: num("min"),
                max: num("max"),
                onStart: () => window.events.push("start"),
                onMove: (_, info) => (window.lastInfo = info),
                onEnd: (_, info) => {
                    window.events.push("end")
                    window.lastInfo = info
                },
            })
        </script>
    </body>
</html>
