<html>
    <head>
        <style>
            body {
                margin: 0;
            }

            #container {
                width: 400px;
                height: 300px;
                background: #eee;
            }

            .box {
                width: 100px;
                height: 100px;
                background-color: #0077ff;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div class="box" id="constrained"></div>
        </div>
        <div class="box" id="free"></div>
        <div class="box" id="axis"></div>
        <script type="module" src="/src/inc.js"></script>
        <script type="module">
            const { drag } = window.MotionDOM

            window.events = []

            drag("#constrained", {
                constraints: document.getElementById("container"),
                elastic: 0,
                momentum: false,
            })

            drag("#free", {
                momentum: false,
                onStart: () => window.events.push("start"),
                onEnd: () => window.events.push("end"),
            })

            drag("#axis", { axis: "y", momentum: false })
        </script>
    </body>
</html>
