<html>
    <head>
        <style>
            body {
                margin: 0;
            }

            #parent {
                position: absolute;
                top: 100px;
                left: 100px;
                width: 300px;
                height: 300px;
                background: #ff0055;
                touch-action: none;
            }

            #button {
                position: absolute;
                top: 50px;
                left: 50px;
                width: 100px;
                height: 100px;
                background: #ffcc00;
                border: none;
            }
        </style>
    </head>
    <body>
        <!--
            A draggable card with a pressable button inside. Every gesture
            phase change from the shared gesture registry is logged to
            window.phases, and press callbacks to window.presses.

            Params: same (the press is on the card, not the button).
        -->
        <div id="parent"><button id="button"></button></div>
        <script type="module" src="/src/inc.js"></script>
        <script type="module">
            const { drag, press, onGestureChange } = window.MotionDOM

            const params = new URLSearchParams(window.location.search)
            const parent = document.getElementById("parent")
            const target = params.has("same")
                ? parent
                : document.getElementById("button")

            window.phases = []
            window.presses = []

            onGestureChange((g) =>
                window.phases.push(g.kind + " " + g.element.id + " " + g.phase)
            )

            drag(parent, { momentum: false })
            press(target, () => {
                window.presses.push("start")
                return (_event, { success }) =>
                    window.presses.push(success ? "tap" : "cancel")
            })
        </script>
    </body>
</html>
