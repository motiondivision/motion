<html>
    <head>
        <style>
            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                background: #0b0b0f;
                color: #eee;
            }

            #variants {
                position: absolute;
                top: 40px;
                left: 40px;
                display: flex;
                gap: 8px;
            }

            #variants button {
                font: inherit;
                padding: 8px 14px;
                border-radius: 999px;
                border: 1px solid #333;
                background: #16161d;
                color: #aaa;
                cursor: pointer;
            }

            #variants button[aria-pressed="true"] {
                background: #eee;
                color: #0b0b0f;
            }

            .slot,
            #card {
                position: absolute;
                top: 200px;
                width: 80px;
                height: 80px;
                border-radius: 20px;
                box-sizing: border-box;
            }

            .slot {
                border: 2px dashed #333;
                transition: border-color 0.2s, background-color 0.2s;
            }

            .slot.active {
                border-color: #8df0cc;
                background-color: rgba(141, 240, 204, 0.08);
            }

            #card {
                left: 40px;
                background: #8df0cc;
                cursor: grab;
            }
        </style>
    </head>
    <body>
        <!--
            Each element is 80x80 at top: 200px. The card's centre starts at
            (80, 240) and the slots' centres are at (280, 240), (440, 240)
            and (600, 240).
        -->
        <div id="variants">
            <button data-variant="pull">Pull</button>
            <button data-variant="snap">Snap</button>
            <button data-variant="release">Release only</button>
        </div>
        <div class="slot" id="a" style="left: 240px"></div>
        <div class="slot" id="b" style="left: 400px"></div>
        <div class="slot" id="c" style="left: 560px"></div>
        <div id="card"></div>
        <script type="module" src="/src/inc.js"></script>
        <script type="module">
            const { drag, magnetic } = window.MotionDOM

            const variants = {
                pull: { radius: 120, pull: 0.6 },
                snap: { radius: 120, pull: 0.3, snap: 40 },
                release: { radius: 120, pull: 0 },
            }

            window.events = []
            let stop

            function select(name) {
                stop?.()
                document
                    .querySelectorAll("#variants button")
                    .forEach((button) =>
                        button.setAttribute(
                            "aria-pressed",
                            button.dataset.variant === name
                        )
                    )

                stop = drag("#card", {
                    constraints: magnetic(".slot", {
                        ...variants[name],
                        onChange: (target) => {
                            document
                                .querySelectorAll(".slot")
                                .forEach((slot) =>
                                    slot.classList.toggle(
                                        "active",
                                        slot === target
                                    )
                                )
                            window.events.push(target ? target.id : null)
                        },
                    }),
                    onTransitionEnd: () => window.events.push("settled"),
                })
            }

            document
                .querySelectorAll("#variants button")
                .forEach((button) =>
                    button.addEventListener("click", () =>
                        select(button.dataset.variant)
                    )
                )

            select("snap")
        </script>
    </body>
</html>
