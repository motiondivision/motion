<html>
    <head>
        <style>
            body {
                margin: 0;
            }

            svg {
                position: absolute;
                left: 100px;
                top: 100px;
                width: 400px;
                height: 200px;
                overflow: visible;
            }

            path,
            circle {
                fill: #eee;
                stroke: #999;
            }

            #box {
                position: absolute;
                width: 20px;
                height: 20px;
                background: red;
            }
        </style>
    </head>
    <body>
        <!--
            pathConstraints() with an SVG path, drawn at 2x its viewBox so
            the constraint has to map the path's own units.

            ?mode=area (default): two corridors, A (viewBox y 0 to 45) and
            B (y 55 to 100), split by a wall from x 0 to 160 and joined
            beyond it. The box's centre starts at viewBox (20, 20), page
            (140, 140).

            ?mode=stroke: a curve from viewBox (10, 80) to (190, 80) through
            a peak at (100, 5). The box's centre starts on its first point,
            page (120, 260).

            ?mode=data: path data relative to the box: a 200 x 100 rect
            from its starting point.

            ?mode=circle: the stroke of a <circle> at viewBox (100, 50) with
            a radius of 40, page (300, 200) and 80. The box's centre starts
            on its left, page (220, 200).

            ?elastic=0.5 sets dragElastic (default false).
            ?momentum=true enables momentum.
        -->
        <svg viewBox="0 0 200 100">
            <path id="path" />
            <circle id="circle" cx="100" cy="50" r="40" />
        </svg>
        <div id="box"></div>
        <script type="module" src="/src/inc.js"></script>
        <script type="module">
            const { drag, pathConstraints } = window.MotionDOM

            const params = new URLSearchParams(window.location.search)
            const mode = params.get("mode") || "area"
            const elastic = params.has("elastic")
                ? parseFloat(params.get("elastic"))
                : false
            const box = document.getElementById("box")
            const path = document.getElementById("path")

            const circle = document.getElementById("circle")
            const start =
                mode === "stroke"
                    ? { x: 120, y: 260 }
                    : mode === "circle"
                    ? { x: 220, y: 200 }
                    : { x: 140, y: 140 }
            if (mode !== "circle") circle.remove()
            else path.remove()
            box.style.left = start.x - 10 + "px"
            box.style.top = start.y - 10 + "px"

            path.setAttribute(
                "d",
                mode === "stroke"
                    ? "M10 80 C 60 -20, 140 -20, 190 80"
                    : "M0 0 H200 V100 H0 V55 H160 V45 H0 Z"
            )
            if (mode === "stroke") path.style.fill = "none"

            window.events = []
            drag(box, {
                constraints:
                    mode === "data"
                        ? pathConstraints("M0 0 H200 V100 H0 Z")
                        : mode === "circle"
                        ? pathConstraints(circle, { stroke: true })
                        : pathConstraints(path, { stroke: mode === "stroke" }),
                elastic,
                momentum: params.get("momentum") === "true",
                onTransitionEnd: () => window.events.push("transitionEnd"),
            })
        </script>
    </body>
</html>
