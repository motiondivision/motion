<html>
    <head>
        <style>
            body {
                margin: 0;
            }
            #list {
                display: flex;
                gap: 10px;
            }
            .card {
                width: 100px;
                height: 100px;
                padding: 10px;
                background: #0cdcf7;
            }
            .child {
                width: 20px;
                height: 20px;
                background: #fff;
            }
            .box {
                width: 4px;
                height: 4px;
                background: #f00;
            }
            #list.moved {
                flex-direction: row-reverse;
            }
            #list.small {
                flex-wrap: wrap;
                gap: 2px;
            }
            #list.small .card {
                width: 10px;
                height: 10px;
                padding: 0;
            }
            #list.small .child {
                width: 4px;
                height: 4px;
            }
            #list.grow.moved .card {
                width: 150px;
            }
            #list.moved .child {
                margin-left: 40px;
            }
        </style>
    </head>
    <body>
        <!--
            Every element a layout animation moves gets will-change:
            transform while it moves, and loses it when the animation ends.
            ?count sets the number of cards. Each card and its child both
            animate, so 201 cards is past the budget of 400 layers.
            ?small makes the cards small enough for hundreds to fit the
            viewport, as a node that stays far outside it gets no layer.
            ?top moves the list that far down the page.
            ?repaint animates the x and the colour of each card, so from
            six cards they repaint every frame and get no layer.
            ?radius gives each card a border radius that Motion corrects,
            and ?grow makes the cards change size as they move.
            ?animated adds that many boxes with a transform animating on
            the compositor, which count towards the same budget.
        -->
        <div id="list"></div>
        <script type="module" src="/src/inc.js"></script>
        <script type="module">
            const { animate, animateLayout } = window.Motion

            const params = new URLSearchParams(location.search)
            const count = Number(params.get("count") || 3)
            const list = document.getElementById("list")
            params.has("grow") && list.classList.add("grow")
            params.has("small") && list.classList.add("small")
            list.style.marginTop = (params.get("top") || 0) + "px"
            for (let i = 0; i < count; i++) {
                const card = document.createElement("div")
                card.className = "card"
                card.dataset.layout = true
                const child = document.createElement("div")
                child.className = "child"
                child.dataset.layout = true
                card.append(child)
                list.append(card)
            }

            const boxes = []
            for (let i = 0; i < Number(params.get("animated")); i++) {
                const box = document.createElement("div")
                box.className = "box"
                document.body.append(box)
                boxes.push(box)
            }
            const animations = boxes.length
                ? animate(boxes, { x: 100 }, { duration: 10, ease: "linear" })
                : undefined
            window.accelerated = () =>
                boxes.filter((box) => box.getAnimations().length).length
            window.stopBoxes = () => animations.stop()

            const cards = document.querySelectorAll(".card")
            params.has("repaint") &&
                animate(
                    cards,
                    { x: 20, backgroundColor: "#00f" },
                    { duration: 10, ease: "linear" }
                )
            params.has("radius") &&
                animate(cards, { borderRadius: 10 }, { duration: 0 })

            window.run = () =>
                animateLayout(() => list.classList.toggle("moved"), {
                    duration: 0.5,
                    ease: "linear",
                })
        </script>
    </body>
</html>
