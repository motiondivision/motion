<html>
    <head>
        <style>
            body {
                margin: 0;
            }
            #list {
                display: flex;
                gap: 10px;
            }
            .card {
                width: 100px;
                height: 100px;
                padding: 10px;
                background: #0cdcf7;
            }
            .child {
                width: 20px;
                height: 20px;
                background: #fff;
            }
            #list.moved {
                flex-direction: row-reverse;
            }
            #list.moved .child {
                margin-left: 40px;
            }
        </style>
    </head>
    <body>
        <!--
            Every element a layout animation moves gets will-change:
            transform while it moves, and loses it when the animation ends.
            ?count sets the number of cards. Each card and its child both
            animate, so 60 cards is past the budget of 100 layers.
        -->
        <div id="list"></div>
        <script type="module" src="/src/inc.js"></script>
        <script type="module">
            const { animateLayout } = window.MotionDOM

            const count = Number(
                new URLSearchParams(location.search).get("count") || 3
            )
            const list = document.getElementById("list")
            for (let i = 0; i < count; i++) {
                const card = document.createElement("div")
                card.className = "card"
                card.dataset.layout = true
                const child = document.createElement("div")
                child.className = "child"
                child.dataset.layout = true
                card.append(child)
                list.append(card)
            }

            window.run = () =>
                animateLayout(() => list.classList.toggle("moved"), {
                    duration: 0.5,
                    ease: "linear",
                })
        </script>
    </body>
</html>
