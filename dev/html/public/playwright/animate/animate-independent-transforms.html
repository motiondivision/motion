<html>
    <head>
        <style>
            body {
                margin: 0;
            }

            .box {
                width: 100px;
                height: 100px;
                background-color: #0077ff;
            }
        </style>
    </head>
    <body>
        <div class="box" id="a"></div>
        <div class="box" id="b"></div>
        <div class="box" id="c"></div>
        <script type="module" src="/src/inc.js"></script>
        <script type="module">
            /**
             * Helpers for tests/animate/independent-transforms.spec.ts,
             * which run their scenarios with page.evaluate().
             */
            window.nextFrames = (count = 1) =>
                new Promise((resolve) => {
                    const next = () =>
                        --count ? requestAnimationFrame(next) : resolve()
                    requestAnimationFrame(next)
                })

            window.wait = (ms) =>
                new Promise((resolve) => setTimeout(resolve, ms))

            /**
             * Wait, then resolve on a frame. WebKit only advances
             * document.timeline on a rendering update, and compositor
             * animations don't request any, so after a plain wait
             * getComputedStyle reads them at a stale time.
             */
            window.waitFrame = (ms) =>
                window.wait(ms).then(() => window.nextFrames(1))

            window.readTransform = (element) => {
                const matrix = new DOMMatrixReadOnly(
                    getComputedStyle(element).transform
                )
                return {
                    x: matrix.m41,
                    y: matrix.m42,
                    scale: Math.hypot(matrix.a, matrix.b),
                    rotate: (Math.atan2(matrix.b, matrix.a) * 180) / Math.PI,
                }
            }

            window.transformAnimations = (element) =>
                element
                    .getAnimations()
                    .filter((animation) =>
                        animation.effect
                            .getKeyframes()
                            .some((keyframe) => "transform" in keyframe)
                    )

            /**
             * Record the element's transform after Motion renders, every
             * frame. t is the document timeline's time, which WAAPI
             * animations are sampled at, and ts is Motion's frame
             * timestamp, which JS animations are sampled at.
             */
            window.recordFrames = (element, ms) =>
                new Promise((resolve) => {
                    const frames = []
                    const start = performance.now()
                    const record = ({ timestamp }) => {
                        frames.push({
                            t: document.timeline.currentTime,
                            ts: timestamp,
                            ...window.readTransform(element),
                            count: window.transformAnimations(element).length,
                        })
                        if (performance.now() - start >= ms) {
                            window.Motion.cancelFrame(record)
                            resolve(frames)
                        }
                    }
                    window.Motion.frame.postRender(record, true)
                })

            window.ready = true
        </script>
    </body>
</html>
