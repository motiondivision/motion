<html>
    <head>
        <style>
            body {
                padding: 0;
                margin: 0;
            }

            .box {
                width: 100px;
                height: 100px;
                background-color: #00cc88;
            }

            .box.open {
                height: 200px;
            }

            #parent {
                display: flex;
            }

            [data-layout-correct="false"] {
                background: #dd1144 !important;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div id="parent">
            <div class="box" id="a">A</div>
            <div class="box" id="b">B</div>
        </div>

        <script type="module" src="/src/imports/projection.js"></script>
        <script type="module" src="/src/imports/script-assert.js"></script>
        <script type="module" src="/src/imports/script-animate.js"></script>
        <script type="module">
            const { createNode, relativeEase } = window.Animate
            const { matchViewportBox } = window.Assert
            const { frame } = window.Projection

            const parent = document.getElementById("parent")
            const a = document.getElementById("a")
            const b = document.getElementById("b")

            const parentProjection = createNode(
                parent,
                undefined,
                {},
                { duration: 0.1 }
            )

            const aProjection = createNode(
                a,
                parentProjection,
                {},
                { duration: 0.1 }
            )

            const bProjection = createNode(
                b,
                parentProjection,
                {},
                { duration: 0.1 }
            )

            const aOrigin = a.getBoundingClientRect()

            /**
             * The spec waits for this to go before it looks for errors, as
             * the check can come after its fixed wait on a slow machine.
             */
            document.body.dataset.layoutPending = ""

            /**
             * Run callback once no node is (or is about to be) animating.
             */
            const nodes = [parentProjection, aProjection, bProjection]
            const whenSettled = (callback) =>
                nodes.some((n) => n.currentAnimation || n.pendingAnimation)
                    ? frame.postRender(() => whenSettled(callback))
                    : callback()

            parentProjection.willUpdate()
            aProjection.willUpdate()
            bProjection.willUpdate()

            a.classList.add("open")

            parentProjection.root.didUpdate()

            frame.postRender(() => {
                frame.postRender(() => {
                    parentProjection.willUpdate()
                    aProjection.willUpdate()
                    bProjection.willUpdate()
                    a.classList.remove("open")
                    parentProjection.root.didUpdate()

                    /**
                     * Start the next update once the last one's 100ms
                     * animations have finished, which can take longer than
                     * 150ms on a slow machine.
                     */
                    setTimeout(
                        () =>
                            whenSettled(() => {
                                parentProjection.willUpdate()
                                aProjection.willUpdate()
                                bProjection.willUpdate()
                                b.classList.add("open")
                                parentProjection.root.didUpdate()

                                frame.postRender(() => {
                                    frame.postRender(() => {
                                        matchViewportBox(a, aOrigin)
                                        delete document.body.dataset.layoutPending
                                    })
                                })
                            }),
                        150
                    )
                })
            })
        </script>
    </body>
</html>
